<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encargado de Obra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e4e7e9;--sf:#fff;--tx:#1b1f23;--mu:#5d676f;--ac:#f5c400;--on:#1b1f23;--bd:#c5cbd0;--ok:#1e7a46;--wa:#b85f00;--er:#c0392b;--tl:#1b1f23;--tt:#f1f3f4;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171a;--sf:#1e2327;--tx:#eceff1;--mu:#9aa5ad;--bd:#343c43;--ok:#4cc27f;--wa:#f0a040;--er:#f27a6c;--tl:#2a3036;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14171a;--sf:#1e2327;--tx:#eceff1;--mu:#9aa5ad;--bd:#343c43;--ok:#4cc27f;--wa:#f0a040;--er:#f27a6c;--tl:#2a3036;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:4px;background:var(--sf);margin:4px 0 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
label{display:block;font-size:14px;color:var(--mu)}
button{border:1.5px solid var(--bd);background:var(--sf);border-radius:4px;padding:10px 14px;cursor:pointer}
.pr{background:var(--ac);color:var(--on);border:0;font-weight:800;width:100%;margin:8px 0;padding:14px}
.dg{color:var(--er);width:100%;margin-top:10px}
.sm{margin:0 0 12px;padding:6px 10px;font-size:14px}
.band{height:10px;margin:8px 0 14px;background:repeating-linear-gradient(-45deg,var(--ac) 0 12px,#1b1f23 12px 24px)}
.ob{font-size:26px;font-weight:800;border:0;background:none;padding:0;margin:0}
.mu{color:var(--mu);font-size:14px;margin:2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px;text-align:left;font-weight:700;background:var(--tl);color:var(--tt);border:0}
.tile b{font-size:28px;line-height:1.2}
.tile small{opacity:.7;font-weight:400}
.card{background:var(--sf);border:1.5px solid var(--bd);border-left:6px solid var(--st,var(--bd));border-radius:4px;padding:12px;margin:10px 0}
.rw{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bd{font-size:13px;font-weight:700;padding:2px 8px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap}
.ok{color:var(--ok);--st:var(--ok)}.wa{color:var(--wa);--st:var(--wa)}.er{color:var(--er);--st:var(--er)}
.card .bd+*,.card b,.card .mu{color:var(--tx)}.card .mu{color:var(--mu)}
.al{padding:10px 12px;border-left:6px solid currentColor;background:var(--sf);margin:8px 0;font-size:15px;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar h1{font-size:22px;flex:1;margin:0}
img{max-width:100%;border-radius:4px;margin-top:8px}
.ck{display:flex;gap:12px;align-items:center;color:var(--tx);font-size:16px;padding:8px 0}
.ck input{width:22px;height:22px;margin:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.g3 input{margin:0}
.big{font-size:20px;font-weight:800;margin:10px 0 0;color:var(--tx)}
.pr2{padding:2px 0}.pr2 input{width:84px;margin:4px 0;text-align:right}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav[hidden]{display:none}
#nav button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;font-size:12px;font-weight:600;color:var(--mu)}
#nav button.on{color:var(--tx);box-shadow:inset 0 3px 0 var(--ac)}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--ac);color:var(--on);border:0;padding:18px;margin:6px 0 10px;font-weight:800;font-size:20px}
.hero small{display:block;font-weight:500;font-size:14px}
.hero svg{width:36px;height:36px;flex:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.qa button{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:14px}
.grp{font-size:14px;font-weight:700;color:var(--mu);margin:18px 0 6px}
.rows{border:1.5px solid var(--bd);border-bottom:0;border-radius:4px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;margin:0;border-width:0 0 1.5px;border-radius:0;background:var(--sf)}
.row svg{width:22px;height:22px;flex:none}
.row svg:last-child{color:var(--mu)}
.row span{flex:1;font-weight:600}
.row small{color:var(--mu);font-weight:400}
.fx{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:auto;margin:0;z-index:6;box-shadow:0 0 0 8px var(--bg)}
#nav button{position:relative}
.dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:#c0392b;color:#fff;font:700 11px/18px system-ui,sans-serif;padding:0 5px;font-style:normal;text-align:center}
.stp{display:flex;align-items:center;gap:6px}
.st{width:44px;height:44px;padding:0;font-size:22px;font-weight:800}
.cr{display:flex;gap:12px;align-items:flex-start}
.cb{flex:1;min-width:0}
.th{width:64px;height:64px;object-fit:cover;margin:0;border-radius:3px;flex:none}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.swb{width:44px;height:44px;padding:0;border:2px solid var(--bd)}
.swb[aria-pressed=true]{outline:3px solid var(--tx);outline-offset:2px}
input[type=color]{height:48px;padding:4px}
:root[data-hc]{--bg:#fff;--sf:#fff;--tx:#000;--mu:#1f2933;--bd:#000;--ok:#006b2e;--wa:#8a4400;--er:#b00020}
@media(prefers-color-scheme:dark){:root[data-hc]:not([data-theme=light]){--bg:#000;--sf:#000;--tx:#fff;--mu:#e5e5e5;--bd:#fff;--ok:#5dff9a;--wa:#ffc04d;--er:#ff7b6e}}
:root[data-hc][data-theme=dark]{--bg:#000;--sf:#000;--tx:#fff;--mu:#e5e5e5;--bd:#fff;--ok:#5dff9a;--wa:#ffc04d;--er:#ff7b6e}
:root[data-hc] input,:root[data-hc] select,:root[data-hc] textarea{border-width:2.5px}
:root[data-big] body{font-size:19px}
:root[data-big] button{min-height:52px;padding:12px 18px}
:root[data-big] input,:root[data-big] select,:root[data-big] textarea{padding:14px;font-size:19px}
:root[data-big] #nav button{padding:12px 4px;font-size:13px}
:root[data-big] .st{width:56px;height:56px}

async function pdfFotos(modo){const J=window.jspdf;if(!J)return toast('No se pudo cargar el generador de PDF. Revisa tu conexión.');const fl=$('#fs')?$('#fs').value:'',rs=(D.r.fotos||[]).filter(r=>r.foto&&(!fl||r.planta==fl)).sort((a,b)=>((a.fecha||'')+(a.planta||''))>((b.fecha||'')+(b.planta||''))?1:-1);if(!rs.length)return toast('No hay fotos para exportar');try{const d=new J.jsPDF({unit:'mm',format:'a4'});rs.forEach((r,i)=>{const s=i%2;if(!s){if(i)d.addPage();hdr(d);d.setFont('helvetica','bold');d.setFontSize(11);d.text('ARCHIVO FOTOGRÁFICO',195,20,{align:'right'});d.setFont('helvetica','normal');d.setFontSize(9);d.text(fl?'Planta: '+fl:'Todas las plantas',195,27,{align:'right'})}const y=s?166:40,p=d.getImageProperties(r.foto),k=Math.min(180/p.width,90/p.height),w=p.width*k,g=p.height*k,x=15+(180-w)/2;d.addImage(r.foto,'JPEG',x,y,w,g);d.setDrawColor(150);d.setLineWidth(.2);d.rect(x,y,w,g);let t=y+96;d.setFont('helvetica','bold');d.setFontSize(11);d.text(`${i+1}. ${[r.planta,r.zona].filter(Boolean).join(' - ')||'Sin zona'}`,15,t);t+=6;d.setFont('helvetica','normal');d.setFontSize(10);d.text('Fecha: '+fd(r.fecha),15,t);t+=6;d.splitTextToSize(r.nota||'',180).slice(0,3).forEach(l=>{d.text(l,15,t);t+=5})});const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.text('Generado con Encargado de Obra',15,291);d.text(`Página ${i} de ${n}`,195,291,{align:'right'})}await guardar(d,'archivo-fotografico'+(fl?'-'+fl.replace(/[^\w-]+/g,'_'):'')+'.pdf',modo)}catch(e){if(!e||e.code!='declined')toast('No se pudo crear el PDF')}}

function applyUI(){const u=D.ui||{},r=document.documentElement,c=u.ac||'#f5c400',L=rgb(),y=(.2126*L[0]+.7152*L[1]+.0722*L[2])/255;if(u.hc)r.dataset.hc='1';else delete r.dataset.hc;if(u.big)r.dataset.big='1';else delete r.dataset.big;if(u.bg===false)r.dataset.nobg='1';else delete r.dataset.nobg;r.style.setProperty('--ac',c);r.style.setProperty('--on',y>.55?'#1b1f23':'#ffffff')}

function logoCol(){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(i,0,0,40,40);const d=x.getImageData(0,0,40,40).data,m={};for(let p=0;p<d.length;p+=4){const R=d[p],G=d[p+1],B=d[p+2];if(d[p+3]<128||Math.max(R,G,B)-Math.min(R,G,B)<40||R+G+B>690||R+G+B<60)continue;const q=[R,G,B].map(v=>v>>5).join();m[q]=m[q]||[0,0,0,0];m[q][0]++;m[q][1]+=R;m[q][2]+=G;m[q][3]+=B}const t=Object.values(m).sort((a,b)=>b[0]-a[0])[0];if(!t)return toast('No encontré un color claro en el logo. Elige uno a mano.');uiSet('ac','#'+[1,2,3].map(j=>Math.round(t[j]/t[0]).toString(16).padStart(2,'0')).join(''))};i.src=D.emp.logo}
